<!DOCTYPE html>
<html>
  <head>
    <title>Documents</title>
    <style>
      img {
        width: 400px;
        height: 400px;
        display: none;
      }
      .show {
        display: block;
      }
      .Data input {
        width: 150px;
      }
      span {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>1-Slideshow</h2>

    <div>
      <button onclick="previous()">Previous</button>
      <button onclick="next()">Next</button>
      <button onclick="start()">Start Slide</button>
      <button onclick="stop()">Stop</button>
    </div>
    <br /><br />

    <img id="img1" src="assets/cappuccino.jpg" class="show" />
    <img id="img2" src="assets/espresso.jpg" />
    <img id="img3" src="assets/latte.jpg" />
    <h2>
      2- Complete the Student form demo to achieve the following requirements.
    </h2>
    <div>
      <label>Department:</label><br />
      <input type="radio" name="department" id="sd" value="SD" />
      <label for="sd">SD</label>
      <input type="radio" name="department" id="os" value="OS" checked />
      <label for="os">OS</label>
      <input type="radio" name="department" id="el" value="EL" />
      <label for="el">EL</label><br />

      <label>Student Name:</label>
      <input type="text" id="txt1" /><br />

      <label>Student Grade:</label>
      <input type="number" id="txt2" min="0" max="100" /><br />

      <button id="btn">Add</button>
      <span id="span">Invalid input</span>
    </div>

    <br /><br />

    <table id="studentTable" border="1px solid ">
      <thead>
        <tr>
          <th>Name</th>
          <th>Grade</th>
          <th>Department</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
